[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincast-forecast-engine"
version = "0.1.0"
description = "Deterministic, auditable forecast engine for Fincast"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fincast-engine = "fincast_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]

