- id: research.revenue_growth
  kind: estimate
  tier: research
  output: {name: revenue_growth, type: float, unit: ratio, min: -0.95, max: 2.0}
  inputs: [historical.revenue_growth]
  evidence_sections: [mdna, transcript_qa, guidance]
  prior: trailing_4q_median
  fallback: prior
  assertions: ["min <= value <= max", "abs(value - prior) <= 0.20 or len(cited_evidence) >= 1"]
  critic: grounding
  max_retries: 2

- id: research.gross_margin
  kind: estimate
  tier: research
  output: {name: gross_margin_pct, type: float, unit: ratio, min: 0.05, max: 0.95, max_delta: 0.08}
  inputs: [historical.gross_margin_pct, forecast.revenue]
  evidence_sections: [mdna, transcript_qa, guidance]
  prior: trailing_4q_median
  fallback: prior
  assertions: ["min <= value <= max", "abs(value - prior) <= 0.08 or len(cited_evidence) >= 1"]
